name: Deploy Astro site to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "zpero-astro/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zpero-astro/package-lock.json

      - name: Install dependencies
        working-directory: zpero-astro
        run: npm ci

      - name: Build Astro site
        working-directory: zpero-astro
        env:
          SITE_URL: https://zpero-site.pages.dev
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy zpero-astro/dist --project-name=zpero-site --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

# Production branch is configured as main in Cloudflare Pages.
